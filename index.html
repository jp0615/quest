<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="解題冒險">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bfe8ff">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/round.woff2" as="font" type="font/woff2" crossorigin>
<title>林克的解題冒險</title>
<style>
@font-face{font-family:QuestRound;src:url(fonts/round.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;min-height:100%}
body{font-family:QuestRound,"PingFang TC","Heiti TC","Noto Sans TC",sans-serif;color:#2f3b35;
  background:linear-gradient(180deg,#bfe8ff 0%,#e3f6ff 34%,#f2fbe6 70%,#e4f5d2 100%) fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky .hill{position:absolute;left:-10%;width:120%;border-radius:50% 50% 0 0}
#sky .h1{bottom:-34vh;height:56vh;background:#cdeaa9}#sky .h2{bottom:-40vh;height:52vh;left:-40%;width:110%;background:#b6df8c}
#sky .h3{bottom:-42vh;height:50vh;left:30%;width:100%;background:#a7d47c}
#sky .mt{position:absolute;bottom:18vh;width:0;height:0;border-left:16vw solid transparent;border-right:16vw solid transparent;border-bottom:22vh solid #d7e7f2;opacity:.9}
#sky .mt::after{content:"";position:absolute;left:-4vw;top:0;border-left:4vw solid transparent;border-right:4vw solid transparent;border-bottom:5vh solid #fff}
.cl{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cl::before{content:"";position:absolute;width:50%;height:150%;left:18%;top:-70%;background:#fff;border-radius:50%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 28px);min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;min-height:56px}
.top .l,.top .r{display:flex;gap:10px;align-items:center}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:8px 18px;font-size:26px;font-weight:800;box-shadow:0 4px 0 rgba(70,110,60,.18);color:#c98a00;white-space:nowrap}
.hearts{display:flex;gap:4px;align-items:center}.hearts svg{width:34px;height:32px}
.btn{display:block;border:0;border-radius:22px;padding:18px 22px;font-size:27px;font-weight:800;color:#fff;background:#2bb7ab;box-shadow:0 6px 0 #17867d;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #17867d}
.btn{width:100%}.btn.small{width:auto;font-size:19px;padding:10px 16px;border-radius:16px;display:inline-block;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.orange{background:#ff9a3d;box-shadow:0 6px 0 #d16d12}.btn.gold{background:#ffc23d;color:#6a4300;box-shadow:0 6px 0 #d29a10}
.btn.green{background:#5cbf4a;box-shadow:0 6px 0 #3c8f2e}.btn.blue{background:#4aa3ef;box-shadow:0 6px 0 #2a72b8}
.btn.purple{background:#9b7be8;box-shadow:0 6px 0 #6c51b8}.btn.gray{background:#8f9a92;box-shadow:0 6px 0 #67716a}.btn.red{background:#ef6b6b;box-shadow:0 6px 0 #b84444}
.btn.stone{background:linear-gradient(#a59d8b,#8c846f);box-shadow:0 6px 0 #625b4b}
.btn.small.gray,.btn.small.blue,.btn.small.purple,.btn.small.green,.btn.small.red,.btn.small.stone,.btn.small.gold{box-shadow:0 4px 0 rgba(0,0,0,.2)}
.hubb{font-size:20px;padding:10px 16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.card{background:rgba(255,255,255,.94);border-radius:26px;padding:18px 20px;box-shadow:0 6px 0 rgba(70,110,60,.16);margin:12px 0}
h1{margin:0}h2{font-size:32px;margin:6px 0 10px;text-align:center;color:#24675f}
/* ---- home ---- */
.hero{display:flex;align-items:center;gap:18px;justify-content:center;margin:6px 0 10px}
.logo{position:relative;padding:18px 34px 20px;border-radius:26px;background:linear-gradient(#efe8d8,#d9d0bc);border:4px solid #9b917b;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 0 0 4px rgba(64,220,205,.35),0 0 30px rgba(64,220,205,.45),0 8px 0 #7d7462}
.logo h1{font-size:58px;letter-spacing:4px;color:#1f6f67;text-shadow:0 2px 0 #fff,0 0 14px rgba(64,220,205,.8)}
.logo .sub{font-size:22px;color:#6b604b;text-align:center;margin-top:4px;letter-spacing:2px}
.logo .rn{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #39d6c8;box-shadow:0 0 10px #39d6c8}
.rn.a{left:-13px;top:50%;margin-top:-11px;background:#e9e2d1}.rn.b{right:-13px;top:50%;margin-top:-11px;background:#e9e2d1}
.sprite{width:118px;height:118px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bub{position:relative;background:#fff;border-radius:22px;padding:14px 18px;font-size:24px;line-height:1.45;box-shadow:0 4px 0 rgba(70,110,60,.16)}
.say{display:flex;gap:12px;align-items:center;margin:8px 0}
.say .sprite{width:84px;height:84px}
.say .bub::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bigstart{font-size:38px;padding:26px 20px;border-radius:30px;background:linear-gradient(#5ad7cb,#24a99d);box-shadow:0 0 0 4px #fff,0 0 26px rgba(64,220,205,.8),0 9px 0 #14786f;margin:16px 0 18px;position:relative;overflow:hidden}
.bigstart::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}
.bigstart small{display:block;font-size:20px;font-weight:600;opacity:.95;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{border:0;border-radius:24px;padding:22px 8px 18px;background:#fff;box-shadow:0 6px 0 rgba(70,110,60,.2);font-family:inherit;font-size:22px;font-weight:800;color:#2f3b35;cursor:pointer;text-align:center;line-height:1.25}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(70,110,60,.2)}
.tile .ic{font-size:58px;display:block;margin-bottom:4px}.tile small{display:block;font-size:17px;font-weight:600;color:#6a7a70;margin-top:4px}
.tile.due{background:#fff6e3;box-shadow:0 6px 0 #e4b257}
.camp{position:relative;height:150px;border-radius:24px;overflow:hidden;margin-top:16px;background:linear-gradient(#d6f0ff,#eaf8ff 55%,#9fd47a 55%,#8cc769);box-shadow:0 6px 0 rgba(70,110,60,.18);border:4px solid #fff}
.camp .it{position:absolute;bottom:18px;font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.camp .lbl{position:absolute;left:14px;top:8px;font-size:19px;font-weight:800;color:#2b6a3a;background:rgba(255,255,255,.8);border-radius:999px;padding:4px 12px}
.camp .emp{position:absolute;left:0;right:0;top:46px;text-align:center;font-size:19px;color:#3d6b45}
/* ---- trial ---- */
.stam{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;color:#2b6a3a}
.stam svg{width:54px;height:54px}
.shrine{position:relative;border-radius:30px;padding:20px 22px;margin:4px 0 12px;
  background:repeating-linear-gradient(0deg,rgba(120,108,84,.12) 0 2px,transparent 2px 58px),repeating-linear-gradient(90deg,rgba(120,108,84,.10) 0 2px,transparent 2px 92px),linear-gradient(#f2ecdf,#e3dac6);
  border:4px solid #a39880;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),inset 0 0 0 7px rgba(57,214,200,.35),0 0 26px rgba(57,214,200,.35),0 8px 0 #81775f}
.shrine .glow{position:absolute;left:30px;right:30px;top:-3px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#39d6c8 20%,#8ff3ea 50%,#39d6c8 80%,transparent);box-shadow:0 0 14px #39d6c8;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.ttag{display:inline-block;font-size:19px;font-weight:800;color:#fff;background:#2b9e94;border-radius:999px;padding:5px 14px;margin-bottom:8px;box-shadow:0 0 10px rgba(57,214,200,.6)}
.ptext{font-size:33px;line-height:1.6;color:#2f3029;font-weight:700}
.ptext .qs{border-radius:8px;padding:0 4px;transition:background .3s}
.ptext .qs.hl{background:#c9f5ef;box-shadow:0 3px 0 #39d6c8}
.spk{float:right;margin:0 0 8px 12px;font-size:30px;width:64px;height:64px;border-radius:50%;border:0;background:#4aa3ef;color:#fff;box-shadow:0 4px 0 #2a72b8;cursor:pointer}
.spk:active{transform:translateY(3px)}
.clues{margin:8px 0 0;padding:0;list-style:none}.clues li{font-size:30px;line-height:1.5;padding:4px 0;font-weight:700}
.clues b{display:inline-block;width:42px;height:42px;line-height:42px;text-align:center;border-radius:50%;background:#2b9e94;color:#fff;margin-right:8px;font-size:24px}
.fig{margin-top:12px;background:rgba(255,255,255,.7);border-radius:18px;padding:10px;text-align:center}
.fig svg{max-width:100%;height:auto}
.steps{display:flex;gap:8px;justify-content:center;margin:4px 0 10px;flex-wrap:wrap}
.steps span{font-size:18px;font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);color:#8a958e}
.steps span.on{background:#2bb7ab;color:#fff;box-shadow:0 0 12px rgba(57,214,200,.8)}
.steps span.done{background:#dff7f3;color:#1f8a80}
.stepbox{background:rgba(255,255,255,.95);border-radius:26px;padding:16px 18px;box-shadow:0 6px 0 rgba(70,110,60,.16)}
.sq{font-size:28px;font-weight:800;color:#24675f;margin-bottom:12px;text-align:center}
.sq small{display:block;font-size:20px;color:#6a7a70;font-weight:600;margin-top:2px}
.opts{display:grid;gap:14px}
.opt{font-family:inherit;font-size:30px;font-weight:800;padding:18px 14px;background:#fff;color:#2f3b35;border:4px solid #bfe3dd;border-radius:22px;box-shadow:0 6px 0 #bfe3dd;cursor:pointer;line-height:1.3}
.opt.eqo{font-size:42px;letter-spacing:1px}
.opt.ok{background:#d6f7e4;border-color:#3cc178;box-shadow:0 6px 0 #3cc178}
.opt.no{background:#ffe1e1;border-color:#ef8b8b;box-shadow:0 6px 0 #ef8b8b;animation:shake .4s;opacity:.7}
.opt.show{border-color:#ffc23d;box-shadow:0 0 0 4px #ffe59a,0 6px 0 #ffc23d}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.eqline{font-size:52px;font-weight:800;text-align:center;letter-spacing:1px;margin:6px 0 10px;color:#2f3029}
.inbox{display:inline-block;min-width:2.3em;padding:0 10px;border-radius:16px;background:#fffbe9;border:4px solid #ffc23d;color:#c76a00;text-align:center;vertical-align:middle;line-height:1.25;min-height:1.35em}
.inbox.ok{border-color:#3cc178;background:#e5fbef;color:#1c8a4c}.inbox.no{animation:shake .4s;border-color:#ef6b6b}
.inbox.blink{box-shadow:0 0 0 0 rgba(255,194,61,.7);animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,194,61,.7)}100%{box-shadow:0 0 0 14px rgba(255,194,61,0)}}
.ansline{font-size:44px;font-weight:800;text-align:center;margin:6px 0 10px}
.ansq{font-size:24px;color:#6a604b;text-align:center;margin-bottom:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:10px auto 0}
.key{font-family:inherit;font-size:40px;font-weight:800;height:78px;border:0;border-radius:20px;background:#fff;color:#2f3b35;box-shadow:0 6px 0 #c9d6cf,inset 0 0 0 3px #e3ece7;cursor:pointer}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 #c9d6cf}
.key.go{background:#2bb7ab;color:#fff;box-shadow:0 6px 0 #17867d}.key.del{background:#f1f4f2;font-size:32px}
.tool{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.hintb{display:flex;gap:10px;align-items:flex-start;margin-top:12px;min-height:10px}
.hintb .sprite{width:70px;height:70px;animation:none}
.hintb .bub{font-size:24px;flex:1;background:#f3fff8;border:3px solid #a8e6c6}
.hintb .bub.warn{background:#fff8e6;border-color:#ffd27a}
.hintb:empty{display:none}
.tiles2{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ntile{font-family:inherit;font-size:36px;font-weight:800;padding:14px 0;border-radius:18px;border:4px solid #d8cfb9;background:#fbf7ee;color:#2f3029;box-shadow:0 5px 0 #c4b999;cursor:pointer;position:relative}
.ntile.x{opacity:.4;text-decoration:line-through;box-shadow:none}.ntile.ok{background:#d6f7e4;border-color:#3cc178;box-shadow:0 0 16px #39d6c8}
#scr{margin-top:12px;border-radius:18px;background:#fffdf6;border:3px dashed #d8cfb9;position:relative;height:300px;overflow:hidden;touch-action:none}
#scr canvas{position:absolute;inset:0}
#scr .colf{position:absolute;left:24px;top:16px;font-size:52px;font-weight:800;color:rgba(80,70,50,.35);text-align:right;line-height:1.2;font-family:QuestRound,monospace;pointer-events:none}
#scr .clr{position:absolute;right:10px;top:10px}
/* chest */
.ov{position:fixed;inset:0;background:rgba(35,60,55,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .panel{max-width:620px;width:100%;text-align:center;background:#fff;border-radius:30px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.pop{animation:popin .35s cubic-bezier(.3,1.6,.6,1)}@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.chest{width:220px;height:200px;margin:0 auto;display:block;overflow:visible}
.chest .lid{transform-origin:30px 92px;transform-box:view-box;animation:lid .7s .35s cubic-bezier(.3,1.5,.6,1) both}
@keyframes lid{from{transform:rotate(0)}to{transform:rotate(-28deg) translate(-6px,-14px)}}
.chest .rays{transform-origin:110px 96px;transform-box:view-box;animation:rays 6s linear infinite,fadein .6s .5s both}
@keyframes rays{to{transform:rotate(360deg)}}@keyframes fadein{from{opacity:0}to{opacity:1}}
.chest .loot{animation:loot .8s .6s cubic-bezier(.3,1.6,.6,1) both}@keyframes loot{from{transform:translateY(40px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.rw{font-size:32px;font-weight:800;margin:8px 0}
.rw small{display:block;font-size:22px;font-weight:600;color:#5c6b62;margin-top:6px}
/* map */
.mapw{border-radius:28px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 rgba(70,110,60,.18);background:#9fd8f2}
.mapw svg{display:block;width:100%;height:auto}
.mapleg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mapleg>div{background:#fff;border-radius:18px;padding:10px 14px;font-size:21px;box-shadow:0 4px 0 rgba(70,110,60,.14)}
.bar{height:16px;border-radius:9px;background:#e6eee9;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#39d6c8,#5cbf4a);border-radius:9px}
/* shop */
.shbal{text-align:center;font-size:30px;font-weight:800;color:#c98a00}.shbal small{display:block;font-size:19px;color:#6a7a70;font-weight:600}
.shgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
.shit{background:#fff;border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 rgba(70,110,60,.16);display:flex;flex-direction:column;gap:6px;align-items:center}
.shit .e{font-size:54px;line-height:1.1}.shit .nm{font-size:21px;font-weight:800}.shit .pr{font-size:19px;color:#c98a00;font-weight:800}
.shit.own{background:#eafff6;box-shadow:0 5px 0 #8fdcc4}.shneed{font-size:17px;color:#8a958e}
/* parent */
.set{display:block;font-size:22px;padding:10px 0;border-bottom:2px dashed #cfd8d3}.set input{width:26px;height:26px;vertical-align:middle;margin-right:8px}
textarea{width:100%;font-size:16px;padding:10px;border:3px solid #cfd8d3;border-radius:14px;min-height:90px;font-family:monospace}
.srow{display:flex;align-items:center;gap:10px;font-size:20px;padding:6px 0}.srow .nm{width:190px}.srow .bar{flex:1;margin:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:rgba(30,60,55,.92);color:#fff;font-size:22px;padding:12px 22px;border-radius:999px;z-index:90;display:none;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.px-cap{display:inline-block;animation:pxDrop .9s steps(6) both}
@keyframes pxDrop{0%{transform:translateY(-120px)}70%{transform:translateY(8px)}100%{transform:none}}
.result h2{font-size:42px}
.mid{text-align:center;font-size:22px;color:#4d5f55}
/* landscape: problem left, steps right */
@media (orientation:landscape) and (min-width:1000px){
  .trial{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
  .trial .shrine{margin:0}.ptext{font-size:31px}
  .key{height:70px}
}
@media (max-width:700px){.tiles{grid-template-columns:1fr 1fr}.logo h1{font-size:40px}.shgrid{grid-template-columns:1fr 1fr}.ptext{font-size:26px}.eqline{font-size:38px}.opt.eqo{font-size:32px}.tiles2{grid-template-columns:repeat(4,1fr)}}

.slate{margin-top:12px;background:#f7f1e4;border:4px solid #c9b48a;border-radius:20px;padding:12px 16px;box-shadow:inset 0 0 0 2px #efe6d4}
.slate .slh{font-size:20px;font-weight:800;color:#7a6240;margin-bottom:6px}
.slate div{font-size:28px;font-weight:800;line-height:1.45;color:#3a3328}
.eqshow{margin-top:10px;background:#fff8e6;border-radius:16px;padding:8px 14px;font-size:30px;font-weight:800;color:#24675f;text-align:center;border:3px solid #ffe08a}
.qpart{margin-top:8px;font-size:30px;font-weight:800;color:#5c6b62;padding:4px 8px;border-radius:12px}
.qpart.on{background:#c9f5ef;color:#1f6f67;box-shadow:0 3px 0 #39d6c8}
.qpart.done{opacity:.7}
.midnote{margin-top:10px;font-size:22px;font-weight:800;color:#c4304a;text-align:center}
.xchips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0}
.xchip{font-family:inherit;font-size:28px;font-weight:800;padding:16px 20px;min-width:132px;border-radius:22px;border:4px solid #bfe3dd;background:#fff;color:#2f3b35;box-shadow:0 6px 0 #bfe3dd;cursor:pointer}
.xchip.on{background:#fff0c2;border-color:#e0a400;box-shadow:0 6px 0 #e0a400;color:#7a4e00}
.xchip.no{background:#ffe1e1;border-color:#ef8b8b;box-shadow:0 6px 0 #ef8b8b;opacity:.75}
.xchip.show{border-color:#ffc23d;box-shadow:0 0 0 4px #ffe59a,0 6px 0 #ffc23d}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* tighter spacing when a trial would overflow an iPad screen */
.trial.dense .shrine{padding:12px 16px;margin:2px 0 8px}
.trial.dense .ptext{font-size:30px;line-height:1.45}
.trial.dense .slate{margin-top:8px;padding:8px 12px}
.trial.dense .slate div{font-size:25px;line-height:1.3}
.trial.dense .fig{margin-top:6px;padding:6px}
.trial.dense .opt{padding:11px 12px;font-size:28px}
.trial.dense .opts{gap:8px}
.trial.dense .pad{gap:8px;margin:6px auto 0}
.trial.dense .key{height:66px;font-size:36px}
.trial.dense .stepbox{padding:10px 14px}
.trial.dense .sq{margin-bottom:8px}
.trial.dense .hintb{margin-top:8px}
.trial.dense .hintb .sprite{width:56px;height:56px}
.trial.dense .hintb .bub{font-size:22px;padding:10px 14px}
.trial.dense .steps{margin:2px 0 6px}

</style>
</head>
<body>

var FK_CAP=20,FK_RE=/^\d{4}-\d{2}-\d{2}$/;

  return fkCap(r)}

    var m=x.m>y.m?x.m:y.m,p=x.p>y.p?x.p:y.p,z={m:m,t:Math.max(x.t,y.t),p:p>=m?p:''};

  return fkCap(a)}
